
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90">
  <style>
    .main {
      fill: #111827;
    }
    .icon-bg {
      fill: #111827;
    }
    .icon-text {
      fill: #ff8500;
      stroke: #a84300;
      stroke-width: 0.7;
      stroke-linejoin: round;
    }
    .sub {
      fill: #64748b;
    }

    /* Dark Mode */
    .dark .main {
      fill: #ffffff;
    }
    .dark .icon-bg {
      fill: #ffffff;
    }
    .dark .icon-text {
      fill: #ff8500;
      stroke: #a84300;
    }
    .dark .sub {
      fill: #94a3b8;
    }

    @media (prefers-color-scheme: dark) {
      .main { fill: #ffffff; }
      .icon-bg { fill: #ffffff; }
      .icon-text { fill: #ff8500; stroke: #a84300; }
      .sub { fill: #94a3b8; }
    }
  </style>

  <!-- Icon Background -->
  <rect class="icon-bg" x="5" y="8" width="72" height="72" rx="17"/>

  <!-- Original Orange Pixel T Logo -->
  <g class="icon-text" transform="translate(-24,-9) scale(0.105)">
    <path d="
      M400 270
      H945
      L850 398
      H740
      V680
      L620 800
      V400
      L510 280
      V398
      H390
      V275
      H400
      Z
    "/>

    <rect x="290" y="170" width="110" height="105"/>
    <rect x="510" y="395" width="100" height="100"/>
    <rect x="415" y="493" width="100" height="100"/>
  </g>

  <!-- Brand Name -->
  <text x="91" y="59" font-family="Arial,sans-serif"
    font-size="37" font-weight="800" class="main">TRICK</text>

  <text x="244" y="59" font-family="Arial,sans-serif"
    font-size="37" font-weight="800" fill="#1687e8">BIN</text>

  <text x="305" y="59" font-family="Arial,sans-serif"
    font-size="16" font-weight="700" class="sub">.COM</text>
</svg>
